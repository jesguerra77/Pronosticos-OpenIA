<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tipster Johnathan Esguerra Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',sans-serif;background:radial-gradient(circle at top,#1e293b,#020617);color:#e2e8f0}
.container{max-width:1200px;margin:auto;padding:30px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.teams{display:flex;align-items:center;gap:15px}
.team{display:flex;align-items:center;gap:10px;font-weight:600}
.team img{width:40px;height:40px;border-radius:50%}
.vs{font-size:1.5rem;color:#38bdf8}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.card{background:linear-gradient(145deg,#1e293b,#0f172a);border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.6);transition:.3s}
.card:hover{transform:translateY(-5px)}
.card h3{margin-top:0;color:#38bdf8}
.projection-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:15px}
.stat-box{background:#020617;padding:15px;border-radius:12px;text-align:center}
.stat-title{font-size:0.8rem;color:#94a3b8}
.stat-value{font-size:1.3rem;font-weight:700}
.highlight{color:#22c55e}
.table{width:100%;margin-top:10px;border-collapse:collapse}
.table th{color:#94a3b8;padding:10px}
.table td{padding:10px;border-top:1px solid #334155;text-align:center}
input{width:70px;padding:6px;border-radius:8px;border:none;background:#020617;color:white;text-align:center}
.positive{color:#22c55e;font-weight:bold}
.neutral{color:#facc15}
.negative{color:#ef4444}
.picks li{margin-bottom:8px}
.badge{display:inline-block;padding:4px 8px;border-radius:8px;font-size:0.8rem;margin-left:5px}
.top{background:#22c55e;color:#020617}
.value{background:#facc15;color:#020617}
</style>
</head>

<body>
<div class="container">

<!-- ======================
     🧠 TEMPLATE CONFIG
     Editar estos valores para cada partido
====================== -->

<script>
const DATA = {
  team1: "México",
  team2: "Portugal",
  flag1: "https://flagcdn.com/w40/mx.png",
  flag2: "https://flagcdn.com/w40/pt.png",

  sot1: "3 – 4.5",
  sot2: "4.8 – 6.5",
  sotTotal: "8 – 10",
  shotsTotal: "24 – 32",

  markets: [
    {name:"Over 8.5 SoT", prob:0.64, odd:1.84},
    {name:"Over 9.5 SoT", prob:0.48, odd:2.40}
  ],

  portugal: [
    {name:"Over 5.5 SoT", prob:0.52, odd:2.10}
  ],

  shots: [
    {name:"Over 24.5 tiros", prob:0.68, odd:1.71}
  ],

  picks: [
    {name:"Over 8.5 SoT", tag:"TOP"},
    {name:"Over 24.5 tiros", tag:"TOP"},
    {name:"Portugal +5.5 SoT", tag:"VALUE"}
  ]
}
</script>

<div class="header">
  <div class="teams">
    <div class="team">
      <img id="flag1"><span id="team1"></span>
    </div>
    <div class="vs">VS</div>
    <div class="team">
      <img id="flag2"><span id="team2"></span>
    </div>
  </div>
  <strong>Modelo Data analitics from Johnathan Esguerra</strong>
</div>

<div class="grid">

<div class="card">
<h3>📈 Proyección del Modelo</h3>
<div class="projection-grid">
  <div class="stat-box"><div class="stat-title">Local SoT</div><div class="stat-value" id="sot1"></div></div>
  <div class="stat-box"><div class="stat-title">Visitante SoT</div><div class="stat-value highlight" id="sot2"></div></div>
  <div class="stat-box"><div class="stat-title">Total SoT</div><div class="stat-value" id="sotTotal"></div></div>
  <div class="stat-box"><div class="stat-title">Total tiros</div><div class="stat-value" id="shotsTotal"></div></div>
</div>
</div>

<div class="card">
<h3>🎯 Mercados SoT</h3>
<table class="table" id="markets"></table>
</div>

<div class="card">
<h3>📊 Equipo Visitante</h3>
<table class="table" id="portugal"></table>
</div>

<div class="card">
<h3>🔢 Total Tiros</h3>
<table class="table" id="shots"></table>
</div>

<div class="card">
<h3>🏆 Picks</h3>
<ul class="picks" id="picks"></ul>
</div>

</div>
</div>

<script>
function renderTable(id,data){
let html="<tr><th>Mercado</th><th>Prob</th><th>Cuota</th><th>EV</th></tr>";
data.forEach(d=>{
let ev=(d.prob*d.odd-1)*100;
html+=`<tr>
<td>${d.name}</td>
<td>${(d.prob*100).toFixed(0)}%</td>
<td><input value="${d.odd}" onchange="calcEV(this,${d.prob})"></td>
<td class="${ev>10?'positive':ev>0?'neutral':'negative'}">${ev.toFixed(1)}%</td>
</tr>`;
});
document.getElementById(id).innerHTML=html;
}

function render(){
document.getElementById('team1').innerText=DATA.team1;
document.getElementById('team2').innerText=DATA.team2;
document.getElementById('flag1').src=DATA.flag1;
document.getElementById('flag2').src=DATA.flag2;

document.getElementById('sot1').innerText=DATA.sot1;
document.getElementById('sot2').innerText=DATA.sot2;
document.getElementById('sotTotal').innerText=DATA.sotTotal;
document.getElementById('shotsTotal').innerText=DATA.shotsTotal;

renderTable('markets',DATA.markets);
renderTable('portugal',DATA.portugal);
renderTable('shots',DATA.shots);

let picksHTML="";
DATA.picks.forEach(p=>{
picksHTML+=`<li>${p.name} <span class="badge ${p.tag==='TOP'?'top':'value'}">${p.tag}</span></li>`;
});
document.getElementById('picks').innerHTML=picksHTML;
}

function calcEV(input,prob){
const cuota=parseFloat(input.value);
if(!cuota)return;
const ev=(prob*cuota)-1;
const evPercent=(ev*100).toFixed(1);
const cell=input.parentElement.nextElementSibling;
cell.innerText=(evPercent>=0?'+':'')+evPercent+'%';
cell.className=evPercent>10?'positive':evPercent>0?'neutral':'negative';
}

render();
</script>
