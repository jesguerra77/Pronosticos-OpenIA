<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betting Johnathan Esguerra Dashboard PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
  --bg: #0f172a;
  --card: rgba(30, 41, 59, 0.7);
  --accent: #38bdf8;
  --win: #22c55e;
  --lose: #ef4444;
  --text: #e2e8f0;
}

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #020617, #0f172a);
  color: var(--text);
}

/* NAV */
.nav {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 20px;
}

.tab {
  cursor: pointer;
  padding: 10px 20px;
  border-radius: 10px;
  background: #1e293b;
}

.active {
  background: var(--accent);
  color: black;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.hidden { display: none; }

/* CARD */
.card {
  background: var(--card);
  backdrop-filter: blur(10px);
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 20px;
}

/* MATCH */
.match {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.team {
  display: flex;
  align-items: center;
  gap: 10px;
}

.team img {
  width: 35px;
  border-radius: 50%;
}

.score {
  font-size: 24px;
  color: var(--accent);
}

/* PICKS */
.pick {
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 8px;
  background: #1e293b;
  display: flex;
  justify-content: space-between;
}

.win { border-left: 5px solid var(--win); }
.lose { border-left: 5px solid var(--lose); }

/* GRID */
.grid {
  display: grid;
  gap: 20px;
}

.grid-2 {
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
}

/* METRICS */
.metric {
  font-size: 18px;
}

</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="tab active" onclick="showTab('picks')">Picks</div>
  <div class="tab" onclick="showTab('history')">Historial</div>
</div>

<!-- PICKS PAGE -->
<div id="picks" class="container">

  <div id="matches"></div>

</div>

<!-- HISTORY PAGE -->
<div id="history" class="container hidden">

  <div class="card">
    <h2>📊 Rendimiento Global</h2>
    <p id="stats"></p>
  </div>

  <div class="card">
    <canvas id="chart"></canvas>
  </div>

</div>

<script>
/* ===== DATA MULTI PARTIDOS ===== */
const matchesData = [
{
  match: {
    teams: { home: "Colombia", away: "Francia" },
    score: "1-3"
  },
  picks: [
    { market: "over_8.5_shots_on_target", result: "win", ev: 0.116 },
    { market: "over_24.5_shots_total", result: "win", ev: 0.131 },
    { market: "btts_yes", result: "win", ev: 0.062 },
    { market: "over_2.5_goals", result: "win", ev: 0.045 }
  ]
}
];

/* ===== FLAGS ===== */
function getFlag(team) {
  const map = {
    "Colombia": "co",
    "Francia": "fr"
  };
  return `https://flagcdn.com/w40/${map[team]}.png`;
}

/* ===== RENDER MATCHES ===== */
function renderMatches() {
  const container = document.getElementById("matches");

  matchesData.forEach(m => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="match">
        <div class="team">
          <img src="${getFlag(m.match.teams.home)}">
          ${m.match.teams.home}
        </div>

        <div class="score">${m.match.score}</div>

        <div class="team">
          ${m.match.teams.away}
          <img src="${getFlag(m.match.teams.away)}">
        </div>
      </div>

      <div>
        ${m.picks.map(p => `
          <div class="pick ${p.result}">
            <span>${p.market}</span>
            <span>${(p.ev*100).toFixed(1)}%</span>
          </div>
        `).join("")}
      </div>
    `;

    container.appendChild(div);
  });
}

/* ===== HISTORIAL ===== */
function calculateStats() {
  let total = 0, wins = 0, bankroll = 0;
  let evolution = [];

  matchesData.forEach(m => {
    m.picks.forEach(p => {
      total++;
      if (p.result === "win") {
        wins++;
        bankroll += 1;
      } else {
        bankroll -= 1;
      }
      evolution.push(bankroll);
    });
  });

  const winrate = ((wins / total) * 100).toFixed(1);

  document.getElementById("stats").innerText =
    `Picks: ${total} | Wins: ${wins} | Winrate: ${winrate}% | Bankroll: ${bankroll}`;

  return evolution;
}

/* ===== CHART ===== */
function renderChart(data) {
  new Chart(document.getElementById("chart"), {
    type: 'line',
    data: {
      labels: data.map((_, i) => i + 1),
      datasets: [{
        label: "Bankroll",
        data: data,
        borderColor: "#38bdf8",
        tension: 0.3
      }]
    }
  });
}

/* ===== TABS ===== */
function showTab(tab) {
  document.getElementById("picks").classList.add("hidden");
  document.getElementById("history").classList.add("hidden");

  document.getElementById(tab).classList.remove("hidden");

  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  event.target.classList.add("active");
}

/* INIT */
renderMatches();
const evo = calculateStats();
renderChart(evo);

</script>

</body>
</html>
