<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Champions Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Inter',sans-serif;
background:linear-gradient(135deg,#020617,#0f172a);
color:#e2e8f0;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
margin-bottom:30px;
color:#38bdf8;
}

/* CARD MATCH */
.match-card{
background:linear-gradient(145deg,#1e293b,#020617);
border-radius:20px;
padding:20px;
margin-bottom:25px;
box-shadow:0 15px 40px rgba(0,0,0,0.6);
}

.match-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.teams{
display:flex;
align-items:center;
gap:15px;
}

.team{
display:flex;
align-items:center;
gap:8px;
font-weight:600;
}

.team img{
width:35px;
border-radius:50%;
border:2px solid #38bdf8;
}

.vs{
font-weight:bold;
color:#38bdf8;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

/* CARD INNER */
.card{
background:#020617;
padding:15px;
border-radius:12px;
}

.card h3{
margin-top:0;
color:#38bdf8;
}

/* PICKS */
.pick{
padding:6px 10px;
border-radius:10px;
margin:5px 0;
display:inline-block;
}

.top{background:#22c55e;color:black}
.value{background:#facc15;color:black}
.risk{background:#ef4444}

/* PROB */
.bar{
height:10px;
background:#1e293b;
border-radius:5px;
overflow:hidden;
margin-top:5px;
}

.fill{
height:100%;
background:#38bdf8;
}

/* RESPONSIVE */
@media(max-width:768px){
.match-header{flex-direction:column;gap:10px}
}
</style>
</head>

<body>

<div class="container">
<h1>🏆 Champions League Dashboard</h1>
<div id="app"></div>
</div>

<script>
const data = [

// PARTIDO 1
{
match_info:{home_team:"Real Madrid",away_team:"Bayern Munich",stadium:"Santiago Bernabeu"},
probabilities:{home_win:0.42,draw:0.30,away_win:0.28},
expected_goals:{"Real Madrid":1.4,"Bayern Munich":1.3},
microstats:{
shots:{"Real Madrid":[12,15],"Bayern Munich":[11,14]},
shots_on_target:{"Real Madrid":[4,6],"Bayern Munich":[4,5]}
},
picks:{
top:[
{selection:"Real Madrid +3.5"},
{selection:"Bayern Munich +3.5"}
],
value:[
{selection:"Under 3.0"},
{selection:"Empate"}
],
risk:[
{selection:"1-1"},
{selection:"BTTS Yes"}
]
},
prediction:{main:"1-1"}
},

// PARTIDO 2
{
match_info:{home_team:"Sporting CP",away_team:"Arsenal",stadium:"Jose Alvalade"},
probabilities:{home_win:0.28,draw:0.29,away_win:0.43},
expected_goals:{"Sporting CP":1.1,"Arsenal":1.5},
microstats:{
shots:{"Sporting CP":[10,13],"Arsenal":[12,15]},
shots_on_target:{"Sporting CP":[3,4],"Arsenal":[4,6]}
},
picks:{
top:[
{selection:"Arsenal +3.5"},
{selection:"Sporting CP +2.5"}
],
value:[
{selection:"Under 3.0"},
{selection:"Arsenal"}
],
risk:[
{selection:"0-1"},
{selection:"Empate"}
]
},
prediction:{main:"0-1"}
}

];

const flags={
"Real Madrid":"es",
"Bayern Munich":"de",
"Sporting CP":"pt",
"Arsenal":"gb"
};

function render(){
const app=document.getElementById("app");

data.forEach(m=>{
const el=document.createElement("div");
el.className="match-card";

el.innerHTML=`
<div class="match-header">
  <div class="teams">
    <div class="team">
      <img src="https://flagcdn.com/w40/${flags[m.match_info.home_team]}.png">
      ${m.match_info.home_team}
    </div>

    <div class="vs">VS</div>

    <div class="team">
      ${m.match_info.away_team}
      <img src="https://flagcdn.com/w40/${flags[m.match_info.away_team]}.png">
    </div>
  </div>

  <div>${m.match_info.stadium}</div>
</div>

<div class="grid">

<div class="card">
<h3>📊 Probabilidades</h3>
Home: ${(m.probabilities.home_win*100).toFixed(0)}%
<div class="bar"><div class="fill" style="width:${m.probabilities.home_win*100}%"></div></div>

Draw: ${(m.probabilities.draw*100).toFixed(0)}%
<div class="bar"><div class="fill" style="width:${m.probabilities.draw*100}%"></div></div>

Away: ${(m.probabilities.away_win*100).toFixed(0)}%
<div class="bar"><div class="fill" style="width:${m.probabilities.away_win*100}%"></div></div>
</div>

<div class="card">
<h3>⚡ xG</h3>
${Object.entries(m.expected_goals).map(([k,v])=>`${k}: ${v}`).join("<br>")}
</div>

<div class="card">
<h3>🎯 Picks</h3>
${m.picks.top.map(p=>`<div class="pick top">${p.selection}</div>`).join("")}
${m.picks.value.map(p=>`<div class="pick value">${p.selection}</div>`).join("")}
${m.picks.risk.map(p=>`<div class="pick risk">${p.selection}</div>`).join("")}
</div>

<div class="card">
<h3>🔮 Predicción</h3>
<strong>${m.prediction.main}</strong>
</div>

</div>
`;

app.appendChild(el);
});
}

render();
</script>

</body>
</html>
