<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Betting Dashboard</title>

<style>
:root {
  --bg: #0f172a;
  --card: rgba(30, 41, 59, 0.6);
  --accent: #38bdf8;
  --win: #22c55e;
  --lose: #ef4444;
  --text: #e2e8f0;
}

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: var(--text);
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

/* CARD BASE */
.card {
  background: var(--card);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
}

/* MATCH HEADER */
.match {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.team {
  display: flex;
  align-items: center;
  gap: 10px;
}

.team img {
  width: 40px;
  border-radius: 50%;
}

.score {
  font-size: 28px;
  font-weight: bold;
  color: var(--accent);
}

/* GRID */
.grid {
  display: grid;
  gap: 20px;
}

.grid-2 {
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
}

/* PICKS */
.pick {
  padding: 12px;
  border-radius: 10px;
  background: #1e293b;
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}

.win { border-left: 5px solid var(--win); }
.lose { border-left: 5px solid var(--lose); }

.badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
}

.top { background: #38bdf8; color: black; }
.value { background: #a78bfa; }

/* METRICS */
.metric {
  font-size: 18px;
  margin-bottom: 5px;
}

.progress {
  height: 10px;
  background: #1e293b;
  border-radius: 5px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #22c55e, #38bdf8);
}

/* TITLES */
h2 {
  margin-bottom: 15px;
  color: var(--accent);
}

</style>
</head>

<body>

<div class="container">

  <!-- MATCH HEADER -->
  <div class="card match">
    <div class="team">
      <img src="https://flagcdn.com/w40/co.png">
      <span>Colombia</span>
    </div>

    <div class="score">1 - 3</div>

    <div class="team">
      <span>Francia</span>
      <img src="https://flagcdn.com/w40/fr.png">
    </div>
  </div>

  <!-- GRID -->
  <div class="grid grid-2">

    <!-- MODEL -->
    <div class="card">
      <h2>📊 Modelo</h2>
      <div class="metric">Goles: 1.2 vs 1.8</div>
      <div class="metric">BTTS: 59%</div>
      <div class="metric">Over 2.5: 55%</div>
    </div>

    <!-- HISTORIAL -->
    <div class="card">
      <h2>📈 Rendimiento</h2>
      <div class="metric">Win Rate: 100%</div>
      <div class="progress">
        <div class="progress-bar" style="width:100%"></div>
      </div>
      <p>4W - 0L</p>
    </div>

  </div>

  <!-- PICKS -->
  <div class="grid grid-2">

    <div class="card">
      <h2>🔥 Top Picks</h2>
      <div id="top"></div>
    </div>

    <div class="card">
      <h2>💎 Value Picks</h2>
      <div id="value"></div>
    </div>

  </div>

  <!-- FEEDBACK -->
  <div class="card">
    <h2>🧠 Feedback</h2>
    <ul>
      <li>Correcta lectura de partido abierto</li>
      <li>Alta precisión en goles</li>
      <li>Subestimación ligera</li>
    </ul>
  </div>

</div>

<script>
const data = {
  picks: {
    top: [
      { market: "over_8.5_shots_on_target", ev: 0.116 },
      { market: "over_24.5_shots_total", ev: 0.131 }
    ],
    value: [
      { market: "btts_yes", ev: 0.062 },
      { market: "over_2.5_goals", ev: 0.045 }
    ]
  },
  results: {
    "over_8.5_shots_on_target": "win",
    "over_24.5_shots_total": "win",
    "btts_yes": "win",
    "over_2.5_goals": "win"
  }
};

function render(type, id, badgeClass) {
  const container = document.getElementById(id);

  data.picks[type].forEach(p => {
    const result = data.results[p.market];

    const el = document.createElement("div");
    el.className = "pick " + (result === "win" ? "win" : "lose");

    el.innerHTML = `
      <span>${p.market}</span>
      <span class="badge ${badgeClass}">${(p.ev*100).toFixed(1)}%</span>
    `;

    container.appendChild(el);
  });
}

render("top", "top", "top");
render("value", "value", "value");
</script>

</body>
</html>
