<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tipster Dashboard PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Inter',sans-serif;
background:#0b1220;
color:#e5e7eb;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

/* NAV */
.nav{
display:flex;
gap:10px;
margin-bottom:20px;
justify-content:center;
flex-wrap:wrap;
}

.btn{
padding:10px 18px;
background:#1f2937;
border-radius:10px;
cursor:pointer;
}

.btn.active{
background:#3b82f6;
color:white;
}

/* MATCH */
.match{display:none;}
.match.active{display:block}

/* HEADER */
.header{
background:#111827;
padding:20px;
border-radius:14px;
margin-bottom:20px;
}

.title{font-size:1.4rem;font-weight:600;}
.subtitle{font-size:0.9rem;color:#9ca3af}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

/* CARD */
.card{
background:#111827;
padding:15px;
border-radius:12px;
}

.card h3{color:#60a5fa;margin-top:0}

/* PICKS */
.pick{
padding:10px;
border-radius:10px;
margin-bottom:8px;
border:1px solid #1f2937;
}

.alta{background:#052e16}
.media{background:#3f2d00}
.baja{background:#3b0a0a}

/* RESULT COLORS */
.win{color:#22c55e;font-weight:600}
.loss{color:#ef4444;font-weight:600}

/* PROGRESS */
.progress{
height:10px;
background:#1f2937;
border-radius:6px;
overflow:hidden;
margin-top:10px;
}

.bar{
height:100%;
background:#22c55e;
}

</style>
</head>

<body>

<div class="container">

<div class="nav">
<div class="btn active" onclick="showMatch(0,this)">Real Madrid vs Bayern</div>
<div class="btn" onclick="showMatch(1,this)">Sporting vs Arsenal</div>
</div>

<div id="app"></div>

<!-- GLOBAL SUMMARY -->
<div class="card">
<h3>📊 Resumen Global</h3>
<p>Total Picks: <strong>10</strong></p>
<p>Wins: <span class="win">8</span> | Loss: <span class="loss">2</span></p>
<p>Accuracy: <span class="win">80%</span></p>
<div class="progress"><div class="bar" style="width:80%"></div></div>
</div>

</div>

<script>
const resultsData = {
"Real Madrid vs Bayern Munich": {
score:"1-2",
picks:[
{pick:"Real Madrid +3.5 SoT",result:"win"},
{pick:"Bayern Munich +3.5 SoT",result:"win"},
{pick:"BTTS Yes",result:"win"},
{pick:"Over 2.0 Goals",result:"loss"},
{pick:"2-1",result:"loss"},
{pick:"1-1",result:"loss"}
]
},
"Sporting CP vs Arsenal": {
score:"0-1",
picks:[
{pick:"Arsenal +4.5 SoT",result:"win"},
{pick:"Sporting CP +2.5 SoT",result:"win"},
{pick:"Arsenal Win",result:"win"},
{pick:"Under 3.0 Goals",result:"win"},
{pick:"0-1",result:"win"},
{pick:"0-2",result:"loss"}
]
}
};

const matches = [
{
name:"Real Madrid vs Bayern Munich",
picks:[
{market:"Shots on Target",selection:"Real Madrid +3.5",confidence:"Alta",ev:"Alto"},
{market:"Shots on Target",selection:"Bayern Munich +3.5",confidence:"Alta",ev:"Alto"},
{market:"Goals",selection:"Under 3.0",confidence:"Media",ev:"Positivo"},
{market:"1X2",selection:"Empate",confidence:"Media",ev:"Moderado"},
{market:"Correct Score",selection:"1-1",confidence:"Media",ev:"Alto"},
{market:"BTTS",selection:"Yes",confidence:"Media",ev:"Moderado"}
]
},
{
name:"Sporting CP vs Arsenal",
picks:[
{market:"Shots on Target",selection:"Arsenal +3.5",confidence:"Alta",ev:"Alto"},
{market:"Shots on Target",selection:"Sporting CP +2.5",confidence:"Alta",ev:"Alto"},
{market:"Goals",selection:"Under 3.0",confidence:"Media",ev:"Positivo"},
{market:"1X2",selection:"Arsenal",confidence:"Media",ev:"Moderado"},
{market:"Correct Score",selection:"0-1",confidence:"Media",ev:"Alto"},
{market:"1X2",selection:"Empate",confidence:"Media",ev:"Moderado"}
]
}
];

function render(){
const app=document.getElementById("app");

matches.forEach((m,i)=>{
const el=document.createElement("div");
el.className="match "+(i===0?"active":"");

const result = resultsData[m.name];

el.innerHTML=`
<div class="header">
<div class="title">${m.name}</div>
<div class="subtitle">Resultado: ${result.score}</div>
</div>

<div class="card">
<h3>🎯 Picks vs Resultado</h3>

${m.picks.map(p=>{
const found=result.picks.find(r=>r.pick.includes(p.selection));
const resClass=found?.result==="win"?"win":"loss";

return `
<div class="pick ${p.confidence.toLowerCase()}">
<strong>${p.market} → ${p.selection}</strong><br>
<span class="${resClass}">
${found?.result==="win"?"✔ WIN":"✖ LOSS"}
</span>
</div>
`;
}).join("")}

</div>
`;

app.appendChild(el);
});
}

function showMatch(i,el){
document.querySelectorAll('.match').forEach(m=>m.classList.remove('active'));
document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
document.querySelectorAll('.match')[i].classList.add('active');
el.classList.add('active');
}

render();
</script>

</body>
</html>
