<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Champions Dashboard PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Inter',sans-serif;
background:#0b1220;
color:#e5e7eb;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

/* NAV */
.nav{
display:flex;
gap:10px;
margin-bottom:20px;
justify-content:center;
flex-wrap:wrap;
}

.btn{
padding:10px 18px;
background:#1f2937;
border-radius:10px;
cursor:pointer;
transition:.2s;
}

.btn.active{
background:#3b82f6;
color:white;
}

/* MATCH */
.match{
display:none;
}

.match.active{
display:block;
}

/* HEADER */
.header{
background:#111827;
padding:20px;
border-radius:14px;
margin-bottom:20px;
}

.title{
font-size:1.4rem;
font-weight:600;
margin-bottom:5px;
}

.subtitle{
font-size:0.9rem;
color:#9ca3af;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

/* CARD */
.card{
background:#111827;
padding:15px;
border-radius:12px;
}

.card h3{
margin-top:0;
color:#60a5fa;
}

/* PROB */
.prob{
margin-bottom:10px;
}

.bar{
height:8px;
background:#1f2937;
border-radius:5px;
overflow:hidden;
}

.fill{
height:100%;
background:#3b82f6;
}

/* PICKS */
.pick{
padding:10px;
border-radius:10px;
margin-bottom:10px;
border:1px solid #1f2937;
}

.pick-header{
font-weight:600;
margin-bottom:5px;
}

/* CONF COLORS */
.alta{background:#052e16;border-color:#22c55e}
.media{background:#3f2d00;border-color:#facc15}
.baja{background:#3b0a0a;border-color:#ef4444}

.meta{
font-size:0.85rem;
color:#9ca3af;
}

/* RESPONSIVE */
@media(max-width:600px){
.title{font-size:1.1rem}
}
</style>
</head>

<body>

<div class="container">

<div class="nav">
<div class="btn active" onclick="showMatch(0,this)">Real Madrid vs Bayern</div>
<div class="btn" onclick="showMatch(1,this)">Sporting vs Arsenal</div>
</div>

<div id="app"></div>

</div>

<script>
const data=[

// MATCH 1
{
info:{
teams:"Real Madrid vs Bayern Munich",
stadium:"Santiago Bernabeu"
},
prob:{home:0.42,draw:0.30,away:0.28},
xg:{"Real Madrid":1.4,"Bayern Munich":1.3},
picks:{
top:[
{market:"Shots on Target",selection:"Real Madrid +3.5",confidence:"Alta",ev:"Alto"},
{market:"Shots on Target",selection:"Bayern Munich +3.5",confidence:"Alta",ev:"Alto"}
],
value:[
{market:"Goals",selection:"Under 3.0",confidence:"Media",ev:"Positivo"},
{market:"1X2",selection:"Empate",confidence:"Media",ev:"Moderado"}
],
risk:[
{market:"Correct Score",selection:"1-1",confidence:"Media",ev:"Alto"},
{market:"BTTS",selection:"Yes",confidence:"Media",ev:"Moderado"}
]
}
},

// MATCH 2
{
info:{
teams:"Sporting CP vs Arsenal",
stadium:"Jose Alvalade"
},
prob:{home:0.28,draw:0.29,away:0.43},
xg:{"Sporting CP":1.1,"Arsenal":1.5},
picks:{
top:[
{market:"Shots on Target",selection:"Arsenal +3.5",confidence:"Alta",ev:"Alto"},
{market:"Shots on Target",selection:"Sporting CP +2.5",confidence:"Alta",ev:"Alto"}
],
value:[
{market:"Goals",selection:"Under 3.0",confidence:"Media",ev:"Positivo"},
{market:"1X2",selection:"Arsenal",confidence:"Media",ev:"Moderado"}
],
risk:[
{market:"Correct Score",selection:"0-1",confidence:"Media",ev:"Alto"},
{market:"1X2",selection:"Empate",confidence:"Media",ev:"Moderado"}
]
}
}

];

function sortPicks(arr){
const order={Alta:1,Media:2,Baja:3};
return arr.sort((a,b)=>order[a.confidence]-order[b.confidence]);
}

function getClass(c){
return c.toLowerCase();
}

function render(){
const app=document.getElementById("app");

data.forEach((m,i)=>{
const el=document.createElement("div");
el.className="match "+(i===0?"active":"");

const all=[...m.picks.top,...m.picks.value,...m.picks.risk];
const sorted=sortPicks(all);

el.innerHTML=`
<div class="header">
<div class="title">${m.info.teams}</div>
<div class="subtitle">${m.info.stadium}</div>
</div>

<div class="grid">

<div class="card">
<h3>📊 Probabilidades</h3>
<div class="prob">Local ${(m.prob.home*100).toFixed(0)}%</div>
<div class="bar"><div class="fill" style="width:${m.prob.home*100}%"></div></div>

<div class="prob">Empate ${(m.prob.draw*100).toFixed(0)}%</div>
<div class="bar"><div class="fill" style="width:${m.prob.draw*100}%"></div></div>

<div class="prob">Visitante ${(m.prob.away*100).toFixed(0)}%</div>
<div class="bar"><div class="fill" style="width:${m.prob.away*100}%"></div></div>
</div>

<div class="card">
<h3>⚡ xG</h3>
${Object.entries(m.xg).map(([k,v])=>`${k}: <strong>${v}</strong>`).join("<br>")}
</div>

<div class="card">
<h3>🎯 Picks (ordenados por confianza)</h3>
${sorted.map(p=>`
<div class="pick ${getClass(p.confidence)}">
<div class="pick-header">${p.market} → ${p.selection}</div>
<div class="meta">Confianza: ${p.confidence} | EV: ${p.ev}</div>
</div>
`).join("")}
</div>

</div>
`;

app.appendChild(el);
});
}

function showMatch(i,el){
document.querySelectorAll('.match').forEach(m=>m.classList.remove('active'));
document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
document.querySelectorAll('.match')[i].classList.add('active');
el.classList.add('active');
}

render();
</script>

</body>
</html>
